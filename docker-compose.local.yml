version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minigame-backend-local
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/etc:/app/etc:ro
    networks:
      - minigame-network
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8888
    container_name: minigame-frontend-local
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    networks:
      - minigame-network
    restart: unless-stopped

networks:
  minigame-network:
    driver: bridge