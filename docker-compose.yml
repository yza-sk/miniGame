version: '3.8'

services:
  # 后端服务
  backend:
    image: crpi-l14b1sc286yk94go.cn-hangzhou.personal.cr.aliyuncs.com/galgame/minigame_backend:v2.0
    container_name: minigame_backend
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/etc:/app/etc:ro
    networks:
      - server

  # 前端服务
  frontend:
    image: crpi-l14b1sc286yk94go.cn-hangzhou.personal.cr.aliyuncs.com/galgame/minigame_frontend:v2.1
    container_name: minigame_frontend
    ports:
      - "10000:10000"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
    networks:
      - server

networks:
  server:
    driver: bridge

volumes:
  backend-config: