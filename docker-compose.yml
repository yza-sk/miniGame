version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: minigame-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-minigame}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - /home/data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minigame-net

  server:
    image: ${SERVER_IMAGE:-minigame-server:latest}
    build:
      context: ./server
    container_name: minigame-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # host:container -> expose host 8080, container listens on 8888 by default
      - "8080:8888"
    networks:
      - minigame-net
    volumes:
      - /home/data/server_etc:/app/etc:ro
    environment:
      # Use admin/password for DB user as requested
      DATABASE_DSN: ${DATABASE_DSN:-admin:password@tcp(mysql:3306)/minigame?parseTime=true&loc=UTC}

  web:
    image: ${WEB_IMAGE:-minigame-web:latest}
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    container_name: minigame-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - minigame-net
    volumes:
      - /home/data/web_static:/usr/share/nginx/html:ro

networks:
  minigame-net:
    driver: bridge

