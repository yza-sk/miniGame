name: Build and Push Docker Images to Alibaba Cloud

on:
  push:
    branches: [ main ]

env:
  # These environment variables resolve to secrets below; set the corresponding
  # secrets in your GitHub repository settings (Settings → Secrets & variables).
  SERVER_IMAGE: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server
  WEB_IMAGE: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: minigame

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ALICLOUD_REGISTRY }}
          username: ${{ secrets.ALICLOUD_USERNAME }}
          password: ${{ secrets.ALICLOUD_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@v4
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Show pushed image references
        run: |
          echo "Server images:" $SERVER_IMAGE:${{ github.sha }} $SERVER_IMAGE:latest
          echo "Web images:" $WEB_IMAGE:${{ github.sha }} $WEB_IMAGE:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait a moment for registry
        run: sleep 5

      - name: Validate required secrets and set defaults
        run: |
          set -e
          if [ -z "${{ secrets.ALICLOUD_REGISTRY }}" ] || [ -z "${{ secrets.ALICLOUD_NAMESPACE }}" ]; then
            echo "::error::ALICLOUD_REGISTRY or ALICLOUD_NAMESPACE is not set. Please set repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_COMPOSE_DIR }}" ]; then
            echo "::error::DEPLOY_HOST/DEPLOY_USER/DEPLOY_COMPOSE_DIR must be set."
            exit 1
          fi
          # set default deploy port to 22 if not provided
          if [ -z "${{ secrets.DEPLOY_PORT }}" ]; then
            echo "DEPLOY_PORT=22" >> $GITHUB_ENV
          else
            echo "DEPLOY_PORT=${{ secrets.DEPLOY_PORT }}" >> $GITHUB_ENV
          fi
          # prepare image envs for later steps
          echo "SERVER_IMAGE=${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server" >> $GITHUB_ENV
          echo "WEB_IMAGE=${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web" >> $GITHUB_ENV

      - name: Debug non-secret env
        run: |
          echo "SERVER_IMAGE=$SERVER_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE"
          echo "DEPLOY_PORT=$DEPLOY_PORT"

      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          passphrase: ${{ secrets.DEPLOY_PRIVATE_KEY_PASSPHRASE }}
          # If you prefer password auth instead of key, comment the two lines above and
          # uncomment the next line (ensure `DEPLOY_PASSWORD` secret is set).
          # password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            set -e
            echo "Logging into container registry: ${{ secrets.ALICLOUD_REGISTRY }}"
            docker login ${{ secrets.ALICLOUD_REGISTRY }} -u ${{ secrets.ALICLOUD_USERNAME }} -p ${{ secrets.ALICLOUD_PASSWORD }}
            echo "Pulling images"
            docker pull ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            docker pull ${{ env.WEB_IMAGE }}:${{ github.sha }}
            # tag to latest so compose using 'latest' works, if you use specific tags skip tagging
            docker tag ${{ env.SERVER_IMAGE }}:${{ github.sha }} ${{ env.SERVER_IMAGE }}:latest || true
            docker tag ${{ env.WEB_IMAGE }}:${{ github.sha }} ${{ env.WEB_IMAGE }}:latest || true
            # change to directory containing your docker-compose.yml on remote
            cd ${{ secrets.DEPLOY_COMPOSE_DIR }}
            # optional: ensure compose pulls latest images, then recreate
            docker-compose pull || true
            docker-compose up -d --remove-orphans
