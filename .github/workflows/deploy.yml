name: Deploy MiniGame

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: minigame

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Build backend
      run: |
        cd server
        go build -v ./...

    - name: Build frontend
      run: |
        cd web
        npm install
        npm run build

    - name: Log in to AliCloud Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.ALICLOUD_REGISTRY }}
        username: ${{ secrets.ALICLOUD_USERNAME }}
        password: ${{ secrets.ALICLOUD_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./server
        push: true
        tags: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server:latest

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./web
        push: true
        build-args:
          - VITE_API_BASE=http://${{ secrets.SSH_HOST }}:8080
        tags: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web:latest

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # Update and install necessary packages
          apt-get update && apt-get install -y docker.io docker-compose

          # Start Docker service if not running
          systemctl start docker
          systemctl enable docker

          # Create data directory if not exists
          mkdir -p /home/data/mysql
          mkdir -p /home/data/server_etc
          mkdir -p /home/data/web_static

          # Create or update docker-compose.yml on server
          cat > /home/docker-compose.yml << 'EOF'
          version: "3.8"

          services:
            mysql:
              image: mysql:8.0
              container_name: minigame-mysql
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: password
                MYSQL_DATABASE: minigame
                MYSQL_USER: admin
                MYSQL_PASSWORD: password
              volumes:
                - /home/data/mysql:/var/lib/mysql
              ports:
                - "3306:3306"
              healthcheck:
                test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                interval: 10s
                timeout: 5s
                retries: 5
              networks:
                - minigame-net

            server:
              image: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server:latest
              container_name: minigame-server
              restart: unless-stopped
              depends_on:
                mysql:
                  condition: service_healthy
              ports:
                - "8080:8888"
              networks:
                - minigame-net
              volumes:
                - /home/data/server_etc:/app/etc:ro
              environment:
                DATABASE_DSN: admin:password@tcp(mysql:3306)/minigame?parseTime=true&loc=UTC

            web:
              image: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web:latest
              container_name: minigame-web
              restart: unless-stopped
              depends_on:
                - server
              ports:
                - "80:80"
              networks:
                - minigame-net
              volumes:
                - /home/data/web_static:/usr/share/nginx/html:ro

          networks:
            minigame-net:
              driver: bridge
          EOF

          # Pull latest images
          docker login -u ${{ secrets.ALICLOUD_USERNAME }} -p ${{ secrets.ALICLOUD_PASSWORD }} ${{ secrets.ALICLOUD_REGISTRY }}
          docker pull ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server:latest
          docker pull ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web:latest
          docker pull mysql:8.0

          # Deploy with docker-compose
          cd /home
          docker-compose up -d
