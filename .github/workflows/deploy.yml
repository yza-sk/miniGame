name: Build, Push and (Optional) Deploy

on:
  push:
    branches: [ main ]

env:
  SERVER_IMAGE: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-server
  WEB_IMAGE: ${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/minigame-web
  DEPENDENT_IMAGES: ${{ secrets.DEPENDENT_IMAGES }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: minigame
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ALICLOUD_REGISTRY }}
          username: ${{ secrets.ALICLOUD_USERNAME }}
          password: ${{ secrets.ALICLOUD_PASSWORD }}

      - name: Mirror dependent images into registry (optional)
        if: ${{ env.DEPENDENT_IMAGES != '' }}
        run: |
          set -e
          echo "DEPENDENT_IMAGES='$DEPENDENT_IMAGES'"
          for img in $DEPENDENT_IMAGES; do
            echo "--- Mirroring $img ---"
            docker pull "$img"
            name="${img%%:*}"
            tag="${img##*:}"
            if [ "$name" = "$tag" ]; then
              tag="latest"
            fi
            base=$(basename "$name")
            target="${{ secrets.ALICLOUD_REGISTRY }}/${{ secrets.ALICLOUD_NAMESPACE }}/$base:$tag"
            docker tag "$img" "$target"
            docker push "$target"
          done

      - name: Build and push server image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest

      - name: Build and push web image
        uses: docker/build-push-action@v4
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Show pushed image references
        run: |
          echo "Server images: $SERVER_IMAGE:${{ github.sha }} $SERVER_IMAGE:latest"
          echo "Web images: $WEB_IMAGE:${{ github.sha }} $WEB_IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: minigame
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Deploy to remote server via SSH
        if: ${{ env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != '' }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            set -e
            echo "Creating deploy directory"
            mkdir -p /home/deploy/miniGame
            echo "Pulling latest images"
            docker pull ${{ env.SERVER_IMAGE }}:latest
            docker pull ${{ env.WEB_IMAGE }}:latest
            echo "Assuming docker-compose.yml is present at /home/deploy/miniGame/docker-compose.yml"
            echo "If you want the workflow to push the compose file, add an scp step or extend this script."
            # Ensure environment defaults on remote (use admin/password as requested)
            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            export MYSQL_USER=${{ secrets.MYSQL_USER }}
            export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            export MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            export DATABASE_DSN=${{ env.SERVER_IMAGE }}
            cd /home/deploy/miniGame
            docker compose pull || true
            docker compose up -d --remove-orphans
