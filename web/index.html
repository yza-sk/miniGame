<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 MiniGame</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif; background:#f5f7fb; }
      #app { max-width: 760px; margin: 24px auto; padding: 0 16px; }
      .topbar { display:flex; justify-content: space-between; align-items:center; margin: 12px 0 16px; }
      .tabs { display:flex; gap:12px; }
      .tab { padding:8px 12px; border-radius:8px; cursor:pointer; background:#e9edf5; color:#334; }
      .tab.active { background:#4f46e5; color:white; }
      .card { background:white; border-radius:12px; box-shadow: 0 6px 20px rgba(0,0,0,.06); padding:16px; }
      .btn { background:#4f46e5; color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; }
      .btn.secondary { background:#e2e8f0; color:#111827; }
      .muted { color:#64748b; font-size:12px }
      @media (max-width:480px){ #app{margin:12px auto} }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
